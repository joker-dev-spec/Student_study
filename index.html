<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SS2 Science BrainBox — Login</title>
<meta name="description" content="SS2 Science BrainBox — WAEC & 3rd Term study app for Nigerian science students">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="hero">
  <div class="login-card">
    <div class="brand">
      <div class="icon">🧠</div>
      <h1>Science<span>BrainBox</span></h1>
      <p>SS2 Science Department — WAEC &amp; 3rd Term Prep</p>
    </div>

    <div class="alert" id="loginAlert"></div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="e.g. Chinedu Okafor" required>
      </div>

      <div class="form-group">
        <label for="school">School Name</label>
        <input type="text" id="school" placeholder="e.g. Federal Government College" required>
      </div>

      <div class="form-group">
        <label for="scienceClass">Class</label>
        <select id="scienceClass">
          <option value="SS2 Science A">SS2 Science A</option>
          <option value="SS2 Science B">SS2 Science B</option>
          <option value="SS2 Science C">SS2 Science C</option>
        </select>
        <div class="hint">🔬 Science Department (auto-selected)</div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg">Enter BrainBox →</button>
    </form>

    <div class="text-center mt-3" style="color:var(--text-light);font-size:0.82rem">
      <p>Subjects: Mathematics · Further Maths · English · Physics · Chemistry · Biology · Computer Science · Geography · Civic Education</p>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
