<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Science BrainBox</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main class="container">
  <div class="page-header text-center">
    <h1>🃏 Science Flashcards</h1>
    <p>Tap a card to flip it — revise formulas and definitions</p>
  </div>

  <div class="fc-category-tabs" id="fcTabs"></div>

  <div class="srs-bar" id="srsBar"></div>

  <div class="flashcard-wrap">
    <div class="flashcard" id="flashcard">
      <div class="flashcard-face flashcard-front" id="fcFront">
        <div class="fc-label">Definition / Formula</div>
        <div class="fc-content">Loading...</div>
      </div>
      <div class="flashcard-face flashcard-back" id="fcBack">
        <div class="fc-label">Answer</div>
        <div class="fc-content">Loading...</div>
      </div>
    </div>
  </div>

  <div class="srs-rating" id="srsRating">
    <button class="btn btn-danger" data-q="0">Again<small>10 min</small></button>
    <button class="btn btn-secondary" data-q="1">Hard<small>1 day</small></button>
    <button class="btn btn-primary" data-q="2">Good<small>schedule</small></button>
    <button class="btn btn-green" data-q="3">Easy<small>longer</small></button>
  </div>

  <div class="flashcard-nav">
    <button class="btn btn-secondary" id="fcPrev">← Prev</button>
    <span class="flashcard-counter" id="fcCounter">1 / 1</span>
    <button class="btn btn-secondary" id="fcNext">Next →</button>
  </div>

  <div class="text-center mt-3">
    <a href="index.html" class="btn btn-secondary">← Back to Tools</a>
  </div>
</main>

<footer class="footer" id="footer"></footer>
<nav class="mobile-nav" id="mobileNav"></nav>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/search.js"></script>
<script src="../js/tools.js"></script>
<script>initFlashcards();</script>
</body>
</html>
